# fly.toml app configuration file generated for near-post on 2026-11-02T11:30:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'near-post'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  NEAR_NETWORK = "testnet"
  NEAR_RPC_URL = "https://test.rpc.fastnear.com"
  LEAGUE_ID = "league-v7.near-post.testnet"
  GOALARS_ID = "goalars-v7.near-post.testnet"
  PLAYERS_ID = "players-v7.near-post.testnet"
  TICKETS_ID = "tickets-v7.near-post.testnet"
  # AI agents: on with the AGENTS_SEED secret (and NEAR_AI_API_KEY for the model).
  AGENTS_RPS = "2"
  AGENTS_RPC_URL = "https://near-testnet.drpc.org"
  PARENT_ACCOUNT_ID = "near-post.testnet"
  EMAIL_MODE = "console"
  PLAY_MATCH_DAYS = "true"
  CLIENT_IP_HEADER = "fly-client-ip"
  # Hackathon demo: no email check. The relay returns the code and the web app
  # signs in at once, so anyone can open an account with any email address.
  # Rate limits still apply. Set to "false" with EMAIL_MODE = "resend" for real.
  INSECURE_DEV_RETURN_CODE = "true"
  # Demo crowd (scripts/seed-demo.mjs): seated one match day in three.
  # Needs the CROWD_PRIVATE_KEY secret.
  CROWD = "rive-nord:5,port-lune:4,pont-levant:3,haute-ville:4,marais:2,vieux-phare:3,saint-cendre:2,cote-rouge:3"
  CROWD_EVERY = "3"
  # The parent tops up the contracts' storage balance when it runs low.
  KEEP_FUNDED = "league-v7.near-post.testnet,players-v7.near-post.testnet,goalars-v7.near-post.testnet,items-v7.near-post.testnet,tickets-v7.near-post.testnet"

# Passkey backups (encrypted in the browser) live on a volume. Create it once:
#   fly volumes create near_post_data --region cdg --size 1
[mounts]
  source = "near_post_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
