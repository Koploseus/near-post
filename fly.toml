# NEAR Post relay + web app on Fly.io.
# Secrets (never here): fly secrets set PARENT_PRIVATE_KEY=... RESEND_API_KEY=...
app = "near-post"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NEAR_NETWORK = "testnet"
  NEAR_RPC_URL = "https://test.rpc.fastnear.com"
  LEAGUE_ID = "league-v3.near-post.testnet"
  PARENT_ACCOUNT_ID = "near-post.testnet"
  EMAIL_MODE = "console"
  PLAY_MATCH_DAYS = "true"
  CLIENT_IP_HEADER = "fly-client-ip"
  # Hackathon demo: no email check. The relay returns the code and the web app
  # signs in at once, so anyone can open an account with any email address.
  # Rate limits still apply. Set to "false" with EMAIL_MODE = "resend" for real.
  INSECURE_DEV_RETURN_CODE = "true"
  # Demo crowd (scripts/seed-demo.mjs): seated one match day in three.
  # Needs the CROWD_PRIVATE_KEY secret.
  CROWD = "rive-nord:5,port-lune:4,pont-levant:3,haute-ville:4,marais:2,vieux-phare:3,saint-cendre:2,cote-rouge:3"
  CROWD_EVERY = "3"
  # The parent tops up the contracts' storage balance when it runs low.
  KEEP_FUNDED = "league-v3.near-post.testnet,players-v3.near-post.testnet,goalars-v3.near-post.testnet"

# One machine, always on: email codes and rate limits live in memory, and the
# scheduler plays match days.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
