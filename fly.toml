# NEAR Post relay + web app on Fly.io.
# Secrets (never here): fly secrets set PARENT_PRIVATE_KEY=... RESEND_API_KEY=...
app = "near-post"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NEAR_NETWORK = "testnet"
  NEAR_RPC_URL = "https://rpc.testnet.near.org"
  LEAGUE_ID = "league-v3.near-post.testnet"
  PARENT_ACCOUNT_ID = "near-post.testnet"
  EMAIL_MODE = "console"
  PLAY_MATCH_DAYS = "true"
  CLIENT_IP_HEADER = "fly-client-ip"

# One machine, always on: email codes and rate limits live in memory, and the
# scheduler plays match days.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
