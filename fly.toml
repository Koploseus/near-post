# fly.toml app configuration file generated for near-post on 2026-11-02T11:30:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'near-post'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLIENT_IP_HEADER = 'fly-client-ip'
  EMAIL_MODE = 'console'
  INSECURE_DEV_RETURN_CODE = 'true'
  LEAGUE_ID = 'league-v3.near-post.testnet'
  NEAR_NETWORK = 'testnet'
  NEAR_RPC_URL = 'https://rpc.testnet.near.org'
  PARENT_ACCOUNT_ID = 'near-post.testnet'
  PLAY_MATCH_DAYS = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
